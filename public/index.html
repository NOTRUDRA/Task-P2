<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEV@Deakin</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <h1 class="m-3 text-2xl font-bold">DEV@Deakin</h1>

    <form action="/" method="POST" class="m-2 flex h-auto w-full flex-col items-center justify-between gap-4 rounded-xl bg-gray-200 p-4 md:w-[75%] md:flex-row">
      <h3 class="text-center font-bold md:text-left">SIGN UP FOR OUR DAILY INSIDER</h3>

      <input class="w-full border-2 p-1 pl-2 md:w-auto" type="email" name="email" id="email" placeholder="Enter your email" required />

      <button type="submit" class="w-full rounded-[0.5rem] bg-gray-400 p-1 px-4 hover:cursor-pointer hover:opacity-85 md:w-auto">Subscribe</button>
    </form>
  </body>
</html>
